<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Invoices — NovahFalcons Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/portal.css">
<style>@keyframes sp{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initShell, setTitle, setContent, fmt, badge, escHtml } from '../assets/shell.js';
import { supabase, getMyProject, getInvoices } from '../assets/supabase.js';

const ctx = await initShell('invoices');
if (!ctx) throw new Error('Not auth');
setTitle('Invoices');

const { data: proj } = await getMyProject(ctx.user.id);

if (!proj) {
  setContent(`
    <div class="ph"><div class="pe">My Portal</div><div class="pt">Invoices</div></div>
    <div class="alert alert-info">&#9432; No active project assigned yet.</div>
  `);
} else {

const { data: invoices } = await getInvoices(proj.id);

// Get approved payments for balance computation
const { data: approvedPayments } = await supabase
  .from('payments').select('amount').eq('client_id', ctx.user.id).eq('status','approved');
const totalPaid = (approvedPayments||[]).reduce((s,p)=>s+Number(p.amount),0);

const rows = (invoices||[]).map(inv => {
  const discountAmt = Number(inv.subtotal) * Number(inv.discount_pct) / 100;
  const effectiveBalance = Math.max(0, Number(inv.total) - totalPaid);
  return `
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:14px">
      <div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal);margin-bottom:4px">${escHtml(inv.invoice_no)}</div>
        <div style="font-size:22px;font-weight:800;letter-spacing:-.3px">LKR ${fmt(inv.total)}</div>
        ${inv.due_date?`<div style="font-size:12px;color:var(--t3);margin-top:3px">Due: ${inv.due_date}</div>`:''}
      </div>
      <div>${badge(inv.status)}</div>
    </div>
    <div style="background:var(--bg);border-radius:8px;padding:12px;font-size:12px">
      <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--t3)">Subtotal</span>
        <span style="font-weight:600">LKR ${fmt(inv.subtotal)}</span>
      </div>
      ${Number(inv.discount_pct)>0?`
      <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--green)">Discount (${inv.discount_pct}%)</span>
        <span style="font-weight:600;color:var(--green)">− LKR ${fmt(discountAmt)}</span>
      </div>`:''}
      ${Number(inv.tax_pct)>0?`
      <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--t3)">Tax (${inv.tax_pct}%)</span>
        <span style="font-weight:600">+ LKR ${fmt(inv.tax_amount)}</span>
      </div>`:''}
      <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="font-weight:700">Total</span>
        <span style="font-weight:800">LKR ${fmt(inv.total)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--t3)">Total Paid (Approved)</span>
        <span style="font-weight:600;color:var(--green)">LKR ${fmt(totalPaid)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:7px 0">
        <span style="font-weight:700;color:var(--amber)">Balance Due</span>
        <span style="font-weight:800;font-size:15px;color:var(--amber)">LKR ${fmt(effectiveBalance)}</span>
      </div>
    </div>
    ${inv.notes?`<div style="margin-top:10px;padding:10px;background:var(--teal-lt);border-radius:6px;font-size:12px;color:var(--t2)">${escHtml(inv.notes)}</div>`:''}
  </div>`;
}).join('') || '<div style="color:var(--t4);font-size:13px;text-align:center;padding:24px">No invoices yet.</div>';

setContent(`
  <div class="ph"><div class="pe">My Portal</div><div class="pt">Invoices</div></div>
  ${rows}
`);
} // end else
</script>
</body>
</html>
