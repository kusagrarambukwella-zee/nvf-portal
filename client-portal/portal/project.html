<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Project Status — NovahFalcons Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/portal.css">
<style>@keyframes sp{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initShell, setTitle, setContent, fmt, badge, progressBar, escHtml } from '../assets/shell.js';
import { getMyProject } from '../assets/supabase.js';

const ctx = await initShell('project');
if (!ctx) throw new Error('Not auth');
setTitle('Project Status');

const { data: proj } = await getMyProject(ctx.user.id);

if (!proj) {
  setContent(`
    <div class="ph"><div class="pe">My Portal</div><div class="pt">Project Status</div></div>
    <div class="alert alert-info">&#9432; No active project assigned yet. Your project manager will set this up shortly.</div>
  `);
} else {

const stages = ['Inquiry','Info Gathering','Proposal','Advance Pending','Advance Received','Project Kickoff','Design Phase','Development','Internal Testing','Client Review 1','Revisions','Client Review 2','Final Testing','Final Payment Pending','Hosting & Deployment','Installation & Training','Sign-Off','Completed'];

const stageItems = stages.map((s,i) => {
  const num = i+1;
  const done = num < proj.stage;
  const current = num === proj.stage;
  return `
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
        background:${done?'var(--teal)':current?'var(--teal-lt)':'var(--bg)'};
        color:${done?'#fff':current?'var(--teal)':'var(--t4)'};
        border:2px solid ${done?'var(--teal)':current?'var(--teal)':'var(--border)'}">
        ${done?'&#10003;':num}
      </div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:${current?700:500};color:${current?'var(--teal)':done?'var(--t3)':'var(--t2)'}">${s}</div>
        ${current?`<div style="font-size:11px;color:var(--teal);margin-top:1px">Current stage</div>`:''}
      </div>
      ${done?`<span style="font-size:11px;color:var(--green);font-weight:600">Done</span>`:''}
    </div>`;
}).join('');

setContent(`
  <div class="ph"><div class="pe">My Portal</div><div class="pt">Project Status</div></div>
  <div class="g2">
    <div class="card">
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal);margin-bottom:3px">${escHtml(proj.code)}</div>
      <div style="font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:14px">${escHtml(proj.title)}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px;color:var(--t3)">Overall Progress</span>
        <span style="font-size:28px;font-weight:800;color:var(--teal)">${proj.progress}%</span>
      </div>
      ${progressBar(proj.progress)}
      <div style="font-size:12px;color:var(--t4);margin-top:5px;margin-bottom:16px">Stage ${proj.stage} of 18 — ${stages[proj.stage-1]||''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg);border-radius:var(--rs);padding:12px">
        <div><div style="font-size:10px;color:var(--t4);font-family:'JetBrains Mono',monospace">PROJECT MANAGER</div><div style="font-size:13px;font-weight:600;margin-top:3px">${escHtml(proj.manager?.full_name||'—')}</div></div>
        <div><div style="font-size:10px;color:var(--t4);font-family:'JetBrains Mono',monospace">STATUS</div><div style="margin-top:3px">${badge(proj.status)}</div></div>
        <div><div style="font-size:10px;color:var(--t4);font-family:'JetBrains Mono',monospace">START DATE</div><div style="font-size:13px;font-weight:600;margin-top:3px">${proj.start_date||'TBD'}</div></div>
        <div><div style="font-size:10px;color:var(--t4);font-family:'JetBrains Mono',monospace">EST. COMPLETION</div><div style="font-size:13px;font-weight:600;margin-top:3px">${proj.estimated_end||'TBD'}</div></div>
      </div>
      ${proj.notes?`<div style="margin-top:14px;padding:12px;background:var(--teal-lt);border-radius:8px;font-size:13px;color:var(--t2)">${escHtml(proj.notes)}</div>`:''}
    </div>
    <div class="card">
      <div class="chd"><div class="ct">Project Stages</div></div>
      ${stageItems}
    </div>
  </div>
`);
} // end else
</script>
</body>
</html>
