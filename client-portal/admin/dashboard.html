<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — NovahFalcons Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/portal.css">
<style>@keyframes sp{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initShell, setTitle, setContent, setTopbarActions, fmt, badge, progressBar, timeAgo, escHtml } from '../assets/shell.js';
import { supabase, getPendingPayments, getAllProjects, getNotifications, logActivity } from '../assets/supabase.js';

const ctx = await initShell('dashboard');
if (!ctx) throw new Error('Not auth');
setTitle('Dashboard');

setTopbarActions(`<button class="tb pr" onclick="window.location.href='./projects.html?new=1'">+ New Project</button>`);

// Load stats in parallel
const [
  { count: projCount },
  { count: clientCount },
  { data: pendingPay },
  { data: recentProj }
] = await Promise.all([
  supabase.from('projects').select('*', { count:'exact', head:true }).eq('status','active'),
  supabase.from('profiles').select('*', { count:'exact', head:true }).eq('role','client'),
  getPendingPayments(),
  supabase.from('projects')
    .select('*, client:profiles!projects_client_id_fkey(company_name), manager:profiles!projects_manager_id_fkey(full_name)')
    .eq('status','active').order('updated_at',{ascending:false}).limit(5)
]);

// Revenue sum
const { data: revData } = await supabase.from('payments').select('amount').eq('status','approved');
const revenue = (revData||[]).reduce((s,r)=>s+Number(r.amount),0);

const projRows = (recentProj.data||[]).map(p => `
  <tr>
    <td><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal)">${escHtml(p.code)}</span></td>
    <td><b>${escHtml(p.client?.company_name||'—')}</b></td>
    <td>${escHtml(p.title)}</td>
    <td>${escHtml(p.manager?.full_name||'—')}</td>
    <td>${badge('active')} Stg ${p.stage}/18</td>
    <td style="min-width:90px">${progressBar(p.progress)}<div style="font-size:10px;color:var(--t4);margin-top:2px">${p.progress}%</div></td>
    <td><span class="risk r${(p.risk||'low')[0]}">${p.risk||'low'}</span></td>
  </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--t4);padding:24px">No active projects yet.</td></tr>';

const payRows = (pendingPay.data||[]).slice(0,4).map(py => `
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
    <div>
      <div style="font-size:13px;font-weight:600">${escHtml(py.client?.company_name||'—')}</div>
      <div style="font-size:11px;color:var(--t3)">LKR ${fmt(py.amount)} · ${escHtml(py.project?.code||'')} · ${timeAgo(py.submitted_at)}</div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-sm btn-ok" onclick="approvePayment(${py.id})">Approve</button>
      <button class="btn btn-sm btn-no" onclick="rejectPayment(${py.id})">Reject</button>
    </div>
  </div>`).join('') || '<div style="color:var(--t4);font-size:13px;padding:12px 0">No pending slips.</div>';

setContent(`
  <div class="ph"><div class="pe">Super Admin</div><div class="pt">Dashboard</div></div>
  <div class="g4">
    <div class="stat" onclick="window.location.href='projects.html'">
      <div class="si" style="background:var(--teal-lt);color:var(--teal)">&#9672;</div>
      <div class="sn">${projCount||0}</div><div class="sl">Active Projects</div>
    </div>
    <div class="stat" onclick="window.location.href='clients.html'">
      <div class="si" style="background:var(--blue-bg);color:var(--blue)">&#11044;</div>
      <div class="sn">${clientCount||0}</div><div class="sl">Clients</div>
    </div>
    <div class="stat" onclick="window.location.href='payments.html'">
      <div class="si" style="background:var(--amber-bg);color:var(--amber)">&#9670;</div>
      <div class="sn">${(pendingPay.data||[]).length}</div><div class="sl">Pending Payments</div>
    </div>
    <div class="stat">
      <div class="si" style="background:var(--green-bg);color:var(--green)">&#9675;</div>
      <div class="sn" style="font-size:18px">LKR ${fmt(revenue)}</div><div class="sl">Total Received</div>
    </div>
  </div>
  <div class="tw">
    <div class="th"><span class="tht">Active Projects</span><a href="projects.html" class="btn btn-sm btn-s" style="margin-left:auto">View all &rarr;</a></div>
    <table class="dt">
      <thead><tr><th>Code</th><th>Client</th><th>Title</th><th>Manager</th><th>Stage</th><th>Progress</th><th>Risk</th></tr></thead>
      <tbody>${projRows}</tbody>
    </table>
  </div>
  <div class="g2">
    <div class="card">
      <div class="chd"><div class="ct">Pending Payment Slips</div><span class="b bam">${(pendingPay.data||[]).length} pending</span></div>
      ${payRows}
    </div>
    <div class="card" id="activity-card">
      <div class="chd"><div class="ct">Recent Activity</div></div>
      <div style="color:var(--t4);font-size:13px">Loading...</div>
    </div>
  </div>
`);

// Load activity log
const { data: actLog } = await supabase
  .from('activity_log')
  .select('*, user:profiles(full_name)')
  .order('logged_at', {ascending:false}).limit(6);

document.getElementById('activity-card').innerHTML = `
  <div class="chd"><div class="ct">Recent Activity</div></div>
  ${(actLog||[]).map(a=>`
    <div class="aci">
      <div class="acd" style="background:var(--teal)"></div>
      <div><div style="font-size:13px;color:var(--t2)">${escHtml(a.action)} · <b>${escHtml(a.module||'')}</b></div>
      <div style="font-size:11px;color:var(--t4)">${escHtml(a.user?.full_name||'System')} · ${timeAgo(a.logged_at)}</div></div>
    </div>`).join('')||'<div style="color:var(--t4);font-size:13px">No activity yet.</div>'}`;

window.approvePayment = async (id) => {
  if (!confirm('Approve this payment?')) return;
  const { updatePaymentStatus } = await import('../assets/supabase.js');
  await updatePaymentStatus(id, 'approved');
  await logActivity(ctx.user.id,'APPROVED','Payments','Payment ID '+id);
  window.location.reload();
};
window.rejectPayment = async (id) => {
  if (!confirm('Reject this payment?')) return;
  const { updatePaymentStatus } = await import('../assets/supabase.js');
  await updatePaymentStatus(id, 'rejected');
  window.location.reload();
};
</script>
</body>
</html>
